name: Apex Descarga — validate source and build Android debug
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript extension smoke tests
        run: node brave-windows/tests/test_extension.js
      - name: Python native host tests
        run: python3 -m unittest discover -s brave-windows/tests -p 'test_*.py' -v
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          # GitHub's Ubuntu runners include Android cmdline-tools.
          # Avoid setup-android@v3 installing obsolete SDK package "tools".
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run static checks
        working-directory: android
        run: python3 scripts/verificar_proyecto.py
      - name: Build debug APK for testing ONLY
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apex-descarga-android-1.0.0-rc1-UNSIGNED-DEBUG-NOT-FOR-RELEASE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
