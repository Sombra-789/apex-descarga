name: Apex Descarga Desktop — Windows 11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-windows/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        working-directory: desktop-windows
        run: python -m pip install -r requirements-build.txt
      - name: Ejecutar tests de motor, historial y cola
        working-directory: desktop-windows
        run: python -m unittest discover -s tests -v
      - name: Compilar EXE autónomo para Windows 11
        working-directory: desktop-windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name ApexDescargaDesktop `
            --icon assets/apex_icon.ico `
            --add-data "assets/apex_icon.png;assets" `
            --collect-all yt_dlp main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller falló' }
      - name: Autocomprobación del ejecutable empaquetado
        working-directory: desktop-windows
        shell: pwsh
        run: |
          & .\dist\ApexDescargaDesktop.exe --self-check
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path .\self-check-error.txt) { Get-Content .\self-check-error.txt }
            throw 'El EXE no superó el self-check.'
          }
      - name: Comprobar SHA-256
        working-directory: desktop-windows
        shell: pwsh
        run: |
          (Get-FileHash .\dist\ApexDescargaDesktop.exe -Algorithm SHA256).Hash | Out-File -FilePath .\dist\ApexDescargaDesktop.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ApexDescargaDesktop-0.1-Windows11-BETA-NO-FIRMADO
          path: |
            desktop-windows/dist/ApexDescargaDesktop.exe
            desktop-windows/dist/ApexDescargaDesktop.exe.sha256
          retention-days: 14
