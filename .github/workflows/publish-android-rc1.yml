name: Publicar APK Android RC1 para pruebas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-rc1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-rc1-pre-release:
    if: github.repository == 'Sombra-789/apex-descarga' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificaciones estáticas
        working-directory: android
        run: python3 scripts/verificar_proyecto.py
      - name: Compilar APK debug de pruebas (NO release)
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar firma de depuración y crear SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK='Apex-Descarga-Android-1.0.0-rc1-DEBUG-TESTING.apk'
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$APK"
          "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$APK"
          cd dist
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"
      - name: Publicar pre-release privada con APK y SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='v1.0.0-rc1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La pre-release $TAG ya existe. No se sobreescriben sus binarios."
            gh release view "$TAG" --json url --jq '.url'
            exit 0
          fi
          gh release create "$TAG" \
            "dist/Apex-Descarga-Android-1.0.0-rc1-DEBUG-TESTING.apk" \
            "dist/Apex-Descarga-Android-1.0.0-rc1-DEBUG-TESTING.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title 'Apex Descarga Android 1.0 RC1 — APK de prueba (NO estable)' \
            --notes-file docs/RC1-TESTING-RELEASE.md \
            --prerelease
