plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apexvisualstudio.descarga'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apexvisualstudio.descarga'
        minSdk 29
        targetSdk 34
        versionCode 9
        versionName '1.0.1'

        ndk {
            // Android phones with 64-bit ARM, plus emulator support.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        // GitHub Actions uses an ephemeral DEBUG signing key. Keep test installs
        // separate so the user's previously installed RC1 and data stay intact.
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // GPL-3.0 third-party Android wrapper for yt-dlp.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
